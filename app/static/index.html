<!DOCTYPE html>
<html>
<head>
    <title>Vendor Agent</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:40px;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:20px;
            max-width:900px;
            margin:auto;
        }

        button{
            padding:15px 25px;
            border:none;
            background:#0f172a;
            color:white;
            border-radius:10px;
            cursor:pointer;
            margin-top:20px;
        }

        pre{
            background:#eaeaea;
            padding:20px;
            overflow:auto;
        }

    </style>

</head>
<body>

<div class="card">

    <h1>Vendor Agent</h1>

    <p>Subir documentos empresa</p>

    <input
        type="file"
        id="files"
        multiple
    >

    <br>

    <button onclick="uploadFiles()">
        Subir documentos
    </button>

    <h2>Resultado</h2>

    <pre id="result"></pre>

</div>

<script>

async function uploadFiles(){

    const filesInput =
        document.getElementById("files")

    const result =
        document.getElementById("result")

    const formData = new FormData()

    for(let i = 0; i < filesInput.files.length; i++){

        formData.append(
            "files",
            filesInput.files[i]
        )
    }

    result.innerText = "Procesando..."

    try{

        const response = await fetch(
            "/upload-company-documents",
            {
                method:"POST",
                body:formData
            }
        )

        const data = await response.json()

        result.innerText =
            JSON.stringify(data, null, 2)

    }catch(error){

        result.innerText =
            JSON.stringify(error, null, 2)
    }
}

</script>

</body>
</html>
