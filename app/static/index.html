<!DOCTYPE html>
<html>

<head>

    <title>Vendor Agent</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:40px;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:20px;
            max-width:900px;
            margin:auto;
        }

        button{
            padding:15px 25px;
            border:none;
            background:#0f172a;
            color:white;
            border-radius:10px;
            cursor:pointer;
            margin-top:20px;
        }

        pre{
            background:#eaeaea;
            padding:20px;
            overflow:auto;
            white-space: pre-wrap;
        }

        hr{
            margin-top:40px;
            margin-bottom:40px;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>Vendor Agent</h1>

    <!-- ========================= -->
    <!-- COMPANY DOCUMENTS -->
    <!-- ========================= -->

    <h2>Subir documentos empresa</h2>

    <input
        type="file"
        id="files"
        multiple
    >

    <br>

    <button onclick="uploadFiles()">
        Subir documentos
    </button>

    <hr>

    <!-- ========================= -->
    <!-- WORD -->
    <!-- ========================= -->

    <h2>Subir formulario Word</h2>

    <input
        type="file"
        id="wordFile"
        accept=".docx"
    >

    <br>

    <button onclick="fillWord()">
        Llenar Word
    </button>

    <hr>

    <!-- ========================= -->
    <!-- EXCEL -->
    <!-- ========================= -->

    <h2>Subir formulario Excel</h2>

    <input
        type="file"
        id="excelFile"
        accept=".xlsx,.xls"
    >

    <br>

    <button onclick="fillExcel()">
        Llenar Excel
    </button>

    <!-- ========================= -->
    <!-- RESULT -->
    <!-- ========================= -->

    <h2>Resultado</h2>

    <pre id="result"></pre>

</div>

<script>

    // =====================================
    // UPLOAD COMPANY DOCUMENTS
    // =====================================

    async function uploadFiles(){

        const filesInput =
            document.getElementById("files")

        const result =
            document.getElementById("result")

        const formData = new FormData()

        for(let i = 0; i < filesInput.files.length; i++){

            formData.append(
                "files",
                filesInput.files[i]
            )
        }

        result.innerText =
            "Procesando documentos..."

        try{

            const response = await fetch(
                "/upload-company-documents",
                {
                    method:"POST",
                    body:formData
                }
            )

            const data =
                await response.json()

            result.innerText =
                JSON.stringify(data, null, 2)

        }catch(error){

            result.innerText =
                JSON.stringify(error, null, 2)
        }
    }

    // =====================================
    // FILL WORD
    // =====================================

    async function fillWord(){

        const input =
            document.getElementById("wordFile")

        const result =
            document.getElementById("result")

        if(!input.files.length){

            result.innerText =
                "Seleccione un archivo Word"

            return
        }

        const formData = new FormData()

        formData.append(
            "file",
            input.files[0]
        )

        result.innerText =
            "Llenando Word..."

        try{

            const response = await fetch(
                "/fill-word",
                {
                    method:"POST",
                    body:formData
                }
            )

            if(!response.ok){

                const errorText =
                    await response.text()

                result.innerText = errorText

                return
            }

            const blob =
                await response.blob()

            const url =
                window.URL.createObjectURL(blob)

            const a =
                document.createElement("a")

            a.href = url
            a.download = "FILLED_FORM.docx"

            document.body.appendChild(a)

            a.click()

            a.remove()

            result.innerText =
                "Word generado correctamente"

        }catch(error){

            result.innerText =
                JSON.stringify(error, null, 2)
        }
    }

    // =====================================
    // FILL EXCEL
    // =====================================

    async function fillExcel(){

        const input =
            document.getElementById("excelFile")

        const result =
            document.getElementById("result")

        if(!input.files.length){

            result.innerText =
                "Seleccione un archivo Excel"

            return
        }

        const formData = new FormData()

        formData.append(
            "file",
            input.files[0]
        )

        result.innerText =
            "Llenando Excel..."

        try{

            const response = await fetch(
                "/fill-excel",
                {
                    method:"POST",
                    body:formData
                }
            )

            if(!response.ok){

                const errorText =
                    await response.text()

                result.innerText =
                    errorText

                return
            }

            const blob =
                await response.blob()

            const url =
                window.URL.createObjectURL(blob)

            // =========================
            // DETECT FILENAME
            // =========================

            const disposition =
                response.headers.get(
                    "content-disposition"
                )

            let filename = "archivo.xlsx"

            if(disposition){

                const match =
                    disposition.match(
                        /filename="?([^"]+)"?/
                    )

                if(match){

                    filename = match[1]
                }
            }

            // =========================
            // DOWNLOAD
            // =========================

            const a =
                document.createElement("a")

            a.href = url
            a.download = filename

            document.body.appendChild(a)

            a.click()

            a.remove()

            result.innerText =
                "Excel generado correctamente"

        }catch(error){

            result.innerText =
                JSON.stringify(error, null, 2)
        }
    }

</script>

</body>

</html>
